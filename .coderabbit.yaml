# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews every PR once the GitHub App is installed on this repository.
language: zh-CN
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "cmd/nakama/**/*.go"
      instructions: |
        Standard library only; do not add dependencies.
        Every user-facing Chinese string must go through L() and have English and Japanese entries in i18n_catalog.go with identical format verbs (TestCatalogComplete enforces this).
        State changes are safety-critical: a side effect (split, pane run, rename, prompt) must record `pending` before it runs, state files are written atomically (temp file + rename), and an UNKNOWN or unconfirmed result is never resent blindly.
        Identity checks compare terminal|pane|kind|session through sameIdent only; flag any new comparison path.
        New behavior needs a test in the existing go test harness (the test binary acts as a fake herdr).
    - path: "prompts/**/*.md"
      instructions: |
        prompts/zh is the original; prompts/en and prompts/ja are translations.
        All three languages must keep the same `<!-- team-rule:* -->` and `<!-- mid-task -->` markers and the same meaning.
        Any change to protocol.md changes protocol_version (its sha256), so teams created before the change refuse init until recreated; call that out.
    - path: "{README.md,README.zh-CN.md,README.ja.md,docs/index.html}"
      instructions: |
        Documentation is kept in English, Simplified Chinese and Japanese; a change in one language must be reflected in the others.
        docs/index.html is generated by tools/build_pages.py (CI runs it with --check); copy changes belong in that script, not in the HTML.
