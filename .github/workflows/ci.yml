name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same PR makes the older run obsolete.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Go ${{ matrix.go }} (macOS)
    # The plugin targets macOS only (tty_darwin.go, herdr-plugin.toml platforms).
    # This is a public repo, so a fork PR must never reach the self-hosted machine:
    # PR runs stay on GitHub-hosted macOS, only push/workflow_dispatch (collaborators
    # only) go to the self-hosted runner. GitHub-hosted minutes are free for public
    # repos, so PR coverage costs nothing.
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["macos-latest"]') || fromJSON('["self-hosted","macos","arm64","xcode"]') }}
    strategy:
      fail-fast: false
      matrix:
        # 1.24.x is the minimum in go.mod (users build the plugin with their own Go);
        # stable matches current gofmt, whose alignment differs between releases.
        go: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        if: matrix.go == 'stable'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - name: build
        run: go build -trimpath -o bin/nakama ./cmd/nakama
      - name: docs/index.html is generated from tools/build_pages.py
        if: matrix.go == 'stable'
        run: python3 tools/build_pages.py --check
