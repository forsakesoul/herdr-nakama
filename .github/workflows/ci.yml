name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      go_test:
        description: "只跑定向 go test，填 go test 之后的参数，例如 -race -run TestSend ./cmd/nakama；留空跑完整检查"
        required: false
        default: ""

permissions:
  contents: read

# A newer commit on the same PR makes the older run obsolete.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Go ${{ matrix.go }} (macOS)
    # The plugin targets macOS only (tty_darwin.go, herdr-plugin.toml platforms).
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.24.x is the minimum in go.mod (users build the plugin with their own Go);
        # stable matches current gofmt, whose alignment differs between releases.
        go: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      # 手动触发且填了 go_test 时只在 stable 上跑定向测试，其余步骤跳过；参数经环境变量传入。
      - name: targeted go test
        if: inputs.go_test != '' && matrix.go == 'stable'
        env:
          GO_TEST_ARGS: ${{ inputs.go_test }}
        run: go test $GO_TEST_ARGS
      - name: gofmt
        if: inputs.go_test == '' && matrix.go == 'stable'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        if: inputs.go_test == ''
        run: go vet ./...
      - name: go test
        if: inputs.go_test == ''
        run: go test -count=1 ./...
      - name: build
        if: inputs.go_test == ''
        run: go build -trimpath -o bin/nakama ./cmd/nakama
      - name: docs/index.html is generated from tools/build_pages.py
        if: inputs.go_test == '' && matrix.go == 'stable'
        run: python3 tools/build_pages.py --check
